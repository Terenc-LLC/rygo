name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Engine drift guard
        run: |
          npm run sync-engine
          git diff --exit-code -- supabase/functions/_shared/ || \
            (echo "Engine drift — run \`npm run sync-engine\` and commit" && exit 1)

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno check shared engine
        run: deno check supabase/functions/_shared/engine/*.ts
